[package]
name = "goaty-loops"
description = "Goaty Loops - an open-source pattern-based digital audio workstation"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "goaty-loops"
path = "src/main.rs"

[dependencies]
goaty-engine = { path = "../engine" }
goaty-flp = { path = "../flp" }
anyhow = "1"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
crossbeam-channel = "0.5"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
