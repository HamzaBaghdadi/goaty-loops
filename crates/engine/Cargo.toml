[package]
name = "goaty-engine"
description = "Sequencer, instruments, mixer and real-time audio engine for Goaty Loops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goaty-flp = { path = "../flp" }
anyhow = "1"
arc-swap = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libloading = "0.8"
vst3 = "0.3"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
flacenc = "0.5.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
# Same version and features as cpal's, so nothing extra is compiled.
windows = { version = "0.54", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_Devices_Properties", "Win32_Media_KernelStreaming", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_Media_Multimedia", "Win32_UI_Shell_PropertiesSystem"] }
